name: Đề xuất tính năng (Feature Request)
description: Đề xuất tính năng mới hoặc cải tiến cho dự án
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề hoặc nhu cầu
      description: Tính năng này giải quyết vấn đề gì cho người dùng hoặc nhóm?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
      description: Mô tả cách bạn muốn tính năng này hoạt động.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Tiêu chí hoàn thành (Acceptance Criteria)
      description: Các điều kiện cần đạt để coi như xong tính năng này (tùy chọn).
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
